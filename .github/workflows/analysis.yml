name: Firmware analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: Install analysis dependencies
        run: python -m pip install -r analysis/requirements.txt
      - name: Validate firmware and documentation
        run: python analysis/scripts/validate_repository.py
      - name: Compare original files
        run: python analysis/scripts/analyze.py
      - name: Normalize and align firmware payloads
        run: python analysis/scripts/decode_compare.py
      - name: Execute original limit routines
        run: python analysis/scripts/emulate_limits.py
      - name: Reproduce disassembly
        run: python analysis/scripts/export_disassembly.py
      - name: Check generated results
        run: git diff --exit-code -- analysis/results analysis/evidence/US/disassembly.txt analysis/evidence/DE/disassembly.txt
